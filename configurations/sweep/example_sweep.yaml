# SwanLab does not provide a native sweep CLI. Use Hydra multirun instead:
# python -m main -m +name=example_sweep algorithm.lr=1e-3,1e-4 experiment.training.batch_size=32,64

program: main.py
method: grid

metric:
  goal: maximize
  name: validation/accuracy

parameters:
  algorithm.lr:
    values: [1e-3, 1e-4]
  experiment.training.batch_size:
    values: [32, 64]

  swanlab.mode:
    value: online

command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}
  - +name=example_lr${algorithm.lr}_batch${experiment.training.batch_size}
